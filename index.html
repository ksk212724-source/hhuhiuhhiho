.pay{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:12px;opacity:.85;margin-top:14px}
.hist{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.hist em{font-style:normal;background:rgba(0,0,0,.45);padding:5px 10px;border-radius:10px;font-size:13px;font-weight:800;animation:pls .4s;box-shadow:0 3px 0 rgba(0,0,0,.5)}.hist em.hi{color:var(--ac)}
/* fx */
.spk{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%);animation:spk .9s ease-out forwards}
@keyframes spk{to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(220deg) scale(.3);opacity:0}}
.fp{position:fixed;z-index:80;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:#fff3a0;text-shadow:var(--ext),0 0 24px #ffb300;pointer-events:none;animation:fpu 1.2s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes fpu{from{transform:translate(-50%,-30%) scale(.4);opacity:0}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}to{transform:translate(-50%,-170%);opacity:0}}
.cn2{position:fixed;top:-50px;z-index:60;pointer-events:none;font-size:28px;animation:cf linear forwards;filter:drop-shadow(0 3px 0 #7a5210)}@keyframes cf{to{transform:translateY(112vh) rotate(var(--r))}}
.bw,.splash{position:fixed;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;overflow:hidden;background:radial-gradient(circle,rgba(70,30,10,.88),rgba(0,0,0,.95));animation:bwi .5s cubic-bezier(.2,1.3,.4,1)}
.splash{background:radial-gradient(circle,rgba(80,24,140,.9),rgba(0,0,0,.95));padding:20px}
.bw::before,.splash::before{content:"";position:absolute;width:150vmax;height:150vmax;background:repeating-conic-gradient(rgba(255,226,140,.16) 0 8deg,transparent 8deg 16deg);animation:rot 16s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%)}
@keyframes rot{to{transform:rotate(360deg)}}
.bt,.splash h1{position:relative;margin:0;font-size:50px;font-weight:900;letter-spacing:.04em;color:#ffe9a0;text-shadow:var(--ext);animation:bto 1s cubic-bezier(.2,1.6,.4,1)}
.bn,.splash .big{position:relative;font-size:68px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-shadow:var(--ext),0 0 30px rgba(255,190,60,.8)}
.splash p{position:relative;margin:0;font-size:19px;font-weight:800;max-width:320px;line-height:1.3}
.splash .tap{position:relative;opacity:.65;font-size:13px;margin-top:14px;animation:pls 1s infinite alternate}
.bw.out,.splash.out{opacity:0;transition:opacity .45s}@keyframes bwi{from{opacity:0;transform:scale(1.2)}}@keyframes bto{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.shake{animation:sk .5s}@keyframes sk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes fi{from{opacity:0}}
/* candy */
.cg{position:relative;aspect-ratio:6/5;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,.06)),rgba(80,26,120,.78);border:2px solid rgba(255,255,255,.4);box-shadow:0 12px 0 #2a0c4a,0 26px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(0,0,0,.35)}
.ct{position:absolute;left:0;top:0;width:16.6667%;height:20%;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,9.5vw,46px);transform:translate(calc(var(--c)*100%),calc(var(--r)*100%));transition:transform .62s cubic-bezier(.34,1.4,.64,1)}
.ct::before{content:"";position:absolute;inset:7%;border-radius:32%;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),rgba(255,255,255,.1) 42%,rgba(0,0,0,.28));box-shadow:inset 0 -3px 4px rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.2)}
.ct span{position:relative;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25)) drop-shadow(0 6px 4px rgba(0,0,0,.4));animation:idl 3s ease-in-out infinite;animation-delay:calc(var(--c)*.2s)}
@keyframes idl{50%{transform:scale(1.07) translateY(-2px)}}
.ct em{position:absolute;font-style:normal;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;transform:translateY(55%);animation:pls 1s infinite alternate}
.ct.hit span{animation:ht .55s ease-in forwards}.ct.hit::before{animation:ht .55s ease-in forwards}
@keyframes ht{30%{transform:scale(1.45) rotate(-10deg);filter:drop-shadow(0 0 16px #fff3a0)}to{transform:scale(0) rotate(40deg);opacity:0}}
/* slots */
.reels5{position:relative;padding:14px;border-radius:26px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),linear-gradient(180deg,#f7e3a0,#c9972f 38%,#7a5116 60%,#d9ae56);border:1px solid #fff0b8;box-shadow:0 12px 0 #5a3a08,0 26px 44px rgba(0,0,0,.6),inset 0 2px 0 #fffb,inset 0 -3px 6px rgba(80,50,5,.5);transition:background .6s,box-shadow .6s}
.reels5.fsm{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 3px),linear-gradient(180deg,#d6a8ff,#8a3fd0 40%,#4a1a80 62%,#b078f0);border-color:#e8d0ff;box-shadow:0 12px 0 #2a0c4a,0 0 50px rgba(180,100,255,.8),0 26px 44px rgba(0,0,0,.6),inset 0 2px 0 #fffb}
.reels5::before{content:"";position:absolute;left:14px;right:14px;top:4px;height:7px;background:radial-gradient(circle,#fff 35%,#ffb300 45%,transparent 50%) 0 0/16px 7px repeat-x;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
.rls{position:relative;display:flex;gap:6px}
.pl{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
.pl polyline{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px currentColor);animation:fi .35s both}
.rl{flex:1;overflow:hidden;border-radius:10px;background:linear-gradient(#0b0b12,#2b2b40 50%,#0b0b12);box-shadow:inset 0 0 20px #000,0 2px 0 rgba(255,255,255,.4);position:relative}
.rl::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.65),rgba(255,255,255,.08) 22%,transparent 45%,transparent 60%,rgba(0,0,0,.65));pointer-events:none}
.rl.ant{animation:ant .5s infinite alternate}@keyframes ant{to{box-shadow:inset 0 0 20px #000,0 0 0 3px #ffe27a,0 0 24px #ffb300}}
.sy{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,9vw,44px);filter:drop-shadow(0 3px 0 rgba(0,0,0,.35)) drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.rl.spin .sy{animation:rs .09s linear infinite;opacity:.8;filter:blur(2px)}@keyframes rs{from{transform:translateY(-30%)}to{transform:translateY(0)}}
.sy.d{animation:dp .5s cubic-bezier(.3,1.6,.5,1)}@keyframes dp{from{transform:translateY(-90%)}}
.sy.win{animation:wp .6s infinite alternate;background:radial-gradient(circle,rgba(255,226,140,.5),transparent 70%)}@keyframes wp{to{transform:scale(1.2) rotate(3deg)}}
/* crash */
.cr{text-align:center;font-size:68px;font-weight:900;font-variant-numeric:tabular-nums;text-shadow:var(--ext)}
.sky{height:210px;border-radius:26px;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.3);background:linear-gradient(#070c24,#223f78 58%,#d98e55);box-shadow:0 10px 0 rgba(0,0,0,.45),0 22px 34px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.4)}
.stars{position:absolute;inset:0;background:radial-gradient(circle,#fff 1px,transparent 2px) 0 0/46px 46px,radial-gradient(circle,#ffe9b0 1px,transparent 2px) 23px 20px/70px 70px;opacity:.7}
.sky.run .stars{animation:pan 1.4s linear infinite}@keyframes pan{to{background-position:-46px 46px,-47px 50px}}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
#ro{position:absolute;font-size:46px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 12px #ffb347) drop-shadow(0 5px 3px rgba(0,0,0,.5))}
.sky.boom::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,200,120,.8),transparent 60%);animation:fo .7s forwards}@keyframes fo{to{opacity:0}}
.bots{margin-top:10px;display:grid;gap:4px}.bot{display:flex;justify-content:space-between;padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:13px;font-weight:600}.bot b.g{color:#7dffb0}
/* cards */
.hand{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;min-height:96px;perspective:600px}
.lab{text-align:center;font-weight:800;opacity:.9}
.card{width:62px;height:90px;border-radius:11px;font-weight:900;font-size:22px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;color:#111;background:linear-gradient(145deg,#fffdf7,#ece6d6);box-shadow:0 2px 0 #d8d0bb,0 4px 0 #bfb6a0,0 14px 18px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.08)}
.card.r{color:#d62839}.card small{font-size:22px;align-self:flex-end;line-height:1}
.card.h{background:repeating-linear-gradient(45deg,#7a1020 0 4px,#560a16 4px 8px);border:4px solid #f6f0e0;box-shadow:0 2px 0 #d8d0bb,0 4px 0 #bfb6a0,0 14px 18px rgba(0,0,0,.55),inset 0 0 0 2px #c9a24a}
.card.big{width:112px;height:160px;font-size:36px}.card.big small{font-size:46px}
.card.n{animation:deal .55s cubic-bezier(.2,1.2,.4,1) both}.card.fl{animation:flipc .55s cubic-bezier(.2,1.2,.4,1) both}
@keyframes deal{from{transform:translate(70px,-90px) rotateY(90deg) rotate(28deg);opacity:0}}@keyframes flipc{from{transform:rotateY(90deg) scale(.9)}}
/* roulette */
.rw{width:250px;margin:4px auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6))}
.rg{display:grid;grid-template-columns:30px repeat(12,1fr);grid-template-rows:repeat(3,38px);gap:3px;margin-top:8px;background:radial-gradient(#13774a,#0a4a2c);padding:8px;border-radius:16px;box-shadow:inset 0 0 36px rgba(0,0,0,.65),0 0 0 4px #5c3a18,0 0 0 6px #9a6a30,0 12px 0 #3a2208,0 22px 30px rgba(0,0,0,.5);transform:perspective(900px) rotateX(10deg)}
.rb{position:relative;border:0;border-radius:6px;color:#fff;font-weight:800;font-size:12px;padding:0;background:#15151c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.5)}
.rb[data-k="n0"]{grid-row:1/4;background:#0a8a3a}
.rb i{position:absolute;top:-8px;right:-4px;min-width:22px;height:22px;border-radius:11px;line-height:22px;background:radial-gradient(circle,#b3121f 52%,transparent 54%),repeating-conic-gradient(#fff 0 14deg,#b3121f 0 45deg);font-size:9px;font-style:normal;text-align:center;z-index:2;box-shadow:0 3px 0 rgba(0,0,0,.6);animation:pls .3s}.rb i:empty{display:none}
.ro{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}.ro.t{grid-template-columns:repeat(3,1fr)}.ro .rb{height:36px;background:rgba(8,70,42,.9)}
.rb.hit{animation:hh .8s infinite alternate;z-index:3}@keyframes hh{to{box-shadow:0 0 0 2px #ffe27a,0 0 18px #ffe27a;transform:scale(1.15)}}
.rwin{position:fixed;left:50%;top:36%;z-index:70;width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#fff;border:8px solid #f2c75c;box-shadow:0 10px 0 rgba(0,0,0,.4),0 0 60px rgba(255,210,90,.8),inset 0 0 30px rgba(0,0,0,.4);text-shadow:0 4px 0 rgba(0,0,0,.4);pointer-events:none;animation:rwi 2s forwards}
@keyframes rwi{0%{transform:translate(-50%,-50%) scale(0) rotate(-180deg)}20%{transform:translate(-50%,-50%) scale(1.15) rotate(0)}30%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
/* mines */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mt{aspect-ratio:1;border-radius:14px;background:linear-gradient(#8a9fd0,#3d4e78 60%,#2d3b5a);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 6px 0 #141c30,0 10px 12px rgba(0,0,0,.4);font-size:30px;padding:0;color:#fff;transition:transform .12s,box-shadow .12s}
.mt:active{transform:translateY(5px);box-shadow:0 1px 0 #141c30}.mt.o{background:linear-gradient(#1b2b4a,#0f1a30);box-shadow:inset 0 0 14px #000;transform:translateY(5px);animation:flip .45s cubic-bezier(.3,1.6,.5,1)}.mt.d{opacity:.5}.mt.x{background:linear-gradient(#7a1a30,#2a0610)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}}
.mi{text-align:center;font-weight:900;margin:4px 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

/* ===== v3: мягче, стекло iOS, компактная раскладка ===== */
:root{--ac:#e8c882;--gold:linear-gradient(180deg,#f6e7bd,#e0c47f 40%,#cfae62 65%,#b8964d 100%);--glass:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 45%,rgba(0,0,0,.18)),rgba(30,28,50,.58);--gb:rgba(255,255,255,.18);--ext:0 2px 6px rgba(0,0,0,.4)}
body::before{opacity:.55}body::after{opacity:.2}
.bal,.box,.tabs,.msnd,.dock,.pill,.gh button{-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 22px rgba(0,0,0,.3)}
.msnd:active,.gh button:active,.pill:active{transform:scale(.94)}
.dock{background:rgba(30,28,50,.58);border-color:rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 30px rgba(0,0,0,.45)}
.dock>.orb{background:radial-gradient(circle at 35% 28%,#fff4cf,#e2c987 42%,#b99a52 80%);box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 18px rgba(232,200,130,.35),inset 0 2px 3px rgba(255,255,255,.7)}
@keyframes orb{50%{box-shadow:0 8px 20px rgba(0,0,0,.45),0 0 26px rgba(232,200,130,.55),inset 0 2px 3px rgba(255,255,255,.7)}}
.btn,.go{border-radius:22px;text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(120,90,20,.25),0 6px 16px rgba(0,0,0,.32)}
.go:active,.btn:active{transform:translateY(1px) scale(.98);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px rgba(0,0,0,.3)}

.go.gh2{background:linear-gradient(180deg,#9499b9,#666b92 55%,#4c5078);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 16px rgba(0,0,0,.32)}
.pill,.pill.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.28)}
.pill.buy{background:linear-gradient(180deg,#98dcb2,#46a46c 55%,#2f7e50);color:#06220f}
.ban div,.tile{filter:saturate(.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -12px 18px rgba(0,0,0,.28),0 12px 26px rgba(0,0,0,.4)}

.tabs button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(0,0,0,.3);transform:none}
.jp{background:linear-gradient(180deg,#5c2238,#2e1022);border-color:rgba(232,200,130,.6);box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 22px rgba(232,190,110,.2)}
.plate{margin:0 auto 6px;padding:5px 20px;font-size:14px;border-width:1px;border-color:rgba(232,200,130,.7);background:linear-gradient(180deg,rgba(90,30,60,.8),rgba(40,10,30,.8));box-shadow:0 6px 16px rgba(0,0,0,.4);text-shadow:0 0 10px rgba(232,200,130,.6)}
.reels5{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px),linear-gradient(180deg,#e2cf9a,#b0914f 40%,#7f6429 60%,#c9ae6a);box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.reels5.fsm{background:linear-gradient(180deg,#c9a8f0,#8a4fc4 40%,#552a8a 62%,#a880e0);box-shadow:0 0 36px rgba(170,110,240,.55),0 14px 30px rgba(0,0,0,.5)}
.cg{box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 36px rgba(0,0,0,.3)}
.bets button{filter:saturate(.82);box-shadow:0 6px 14px rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,255,255,.2)}

.mt{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 5px 12px rgba(0,0,0,.35)}
.card{box-shadow:0 8px 16px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08)}.card.h{box-shadow:0 8px 16px rgba(0,0,0,.45),inset 0 0 0 2px #c9a24a}
