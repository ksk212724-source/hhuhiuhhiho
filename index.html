<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Lucky Nova</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0c0f;--cd:#1a1c22;--tx:#fff;--mu:#8b90a0;--ac:#b8f000;--ax:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f4f7;--cd:#fff;--tx:#111;--mu:#667}}
:root[data-theme="light"]{--bg:#f3f4f7;--cd:#fff;--tx:#111;--mu:#667}
:root[data-theme="dark"]{--bg:#0b0c0f;--cd:#1a1c22;--tx:#fff;--mu:#8b90a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,Inter,Segoe UI,sans-serif}
#app{max-width:480px;margin:auto;padding:14px 14px 110px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:900;font-size:21px;color:var(--ac);letter-spacing:.5px}
.bal{background:var(--cd);padding:9px 14px;border-radius:12px;font-weight:800}
.ban{display:flex;gap:10px;margin-bottom:14px}
.ban div{flex:1;border-radius:16px;padding:14px;font-weight:800;font-size:17px;min-height:78px;color:#fff}
.tabs{display:flex;gap:8px;overflow-x:auto;background:var(--cd);padding:6px;border-radius:14px;margin-bottom:18px}
.tabs button{border:0;background:none;color:var(--mu);font-weight:700;font-size:15px;padding:11px 16px;border-radius:10px;white-space:nowrap}
.tabs button.on{background:var(--ac);color:var(--ax)}
h2{font-size:21px;margin:6px 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-bottom:22px}
.tile{flex:0 0 138px;height:190px;border-radius:18px;scroll-snap-align:start;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:10px;border:3px solid rgba(255,255,255,.08)}
.tile .em{position:absolute;top:22px;font-size:62px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.tile b{font-size:19px;text-align:center;line-height:1;text-transform:uppercase;text-shadow:0 2px 4px rgba(0,0,0,.5);color:#fff;font-weight:900}
.tile i{font-style:normal;font-size:9px;border:1px solid rgba(255,255,255,.6);border-radius:4px;padding:2px 6px;margin-top:8px;color:#fff;letter-spacing:.5px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);display:flex;justify-content:space-around;align-items:center;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{border:0;background:none;color:var(--mu);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.nav button span{font-size:22px}.nav button.on{color:var(--ac)}
.nav .lg{font-weight:900;font-size:15px;color:var(--tx);font-style:italic}
.box{background:var(--cd);border-radius:18px;padding:16px;margin-bottom:14px}
.pr{display:flex;gap:8px}
.pr input{flex:1;min-width:0;padding:13px;border-radius:10px;border:1px solid var(--mu);background:var(--bg);color:var(--tx);font-size:16px}
.btn,.go{border:0;border-radius:12px;background:var(--ac);color:var(--ax);font-weight:800;padding:13px 18px;font-size:16px}
.go{width:100%;padding:16px;font-size:18px;margin-top:8px}.go:disabled{opacity:.45}
.go.alt{background:#ff4d6d;color:#fff}
.sm{color:var(--mu);font-size:12px;line-height:1.4;margin-top:8px}
#g{display:none;position:fixed;inset:0;z-index:10;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.gh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.gh button{border:0;background:rgba(0,0,0,.35);color:#fff;width:42px;height:42px;border-radius:12px;font-size:20px}
.gh b{font-size:18px;color:#fff}
.gb{max-width:480px;margin:auto;padding:6px 14px calc(30px + env(safe-area-inset-bottom,0px))}
.reels{display:flex;gap:10px;justify-content:center;margin:18px 0}
.reel{width:30%;max-width:110px;aspect-ratio:.85;background:rgba(0,0,0,.4);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:58px;border:3px solid transparent}
.reel.sp{animation:bn .12s infinite}@keyframes bn{50%{transform:translateY(7px);opacity:.6}}
.w .reel{border-color:var(--ac);box-shadow:0 0 18px var(--ac)}
.msg{text-align:center;font-weight:800;min-height:26px;margin:6px 0;color:#fff;font-size:17px}
.bets{display:flex;gap:8px;margin:10px 0}
.bets button{flex:1;padding:11px;border:0;border-radius:10px;background:rgba(0,0,0,.4);color:#fff;font-weight:800;font-size:15px}
.bets button.on{background:var(--ac);color:var(--ax)}
.pay{color:#fff;opacity:.75;font-size:12px;text-align:center;margin-top:8px}
.cr{text-align:center;font-size:64px;font-weight:900;color:#fff;margin-top:12px;font-variant-numeric:tabular-nums}
.sky{height:190px;border-radius:18px;background:rgba(0,0,0,.4);position:relative;overflow:hidden;margin-top:8px;display:flex;align-items:flex-end;justify-content:center}
.sky span{font-size:56px;transition:transform .1s linear;padding-bottom:8px}
.hist{display:flex;gap:6px;overflow-x:auto;margin-top:10px}
.hist em{font-style:normal;background:rgba(0,0,0,.4);color:#fff;padding:5px 9px;border-radius:8px;font-size:13px;font-weight:700}
.hist em.hi{color:var(--ac)}
.hand{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;min-height:96px}
.card{width:62px;height:90px;background:#fff;color:#111;border-radius:10px;font-weight:900;font-size:22px;padding:6px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.card.r{color:#d62839}.card.h{background:repeating-linear-gradient(45deg,#4361ee,#4361ee 6px,#3a0ca3 6px,#3a0ca3 12px)}
.card.big{width:110px;height:160px;font-size:36px}
.lab{color:#fff;text-align:center;font-weight:700;opacity:.85}
.two{display:flex;gap:8px}.two button{flex:1}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;display:none;font-weight:700;max-width:90%;text-align:center}
.ic{width:28px;height:28px;display:block}
.logo{display:flex;align-items:center;gap:8px}.logo .ic{width:26px;height:26px}
.bal{display:flex;align-items:center;gap:6px}.bal .ic{width:22px;height:22px}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.tile{background-blend-mode:normal}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.35),transparent 55%),linear-gradient(transparent 55%,rgba(0,0,0,.6));pointer-events:none}
.tile b,.tile i{position:relative;z-index:2}
.glow{position:absolute;top:-30px;left:50%;width:220px;height:220px;margin-left:-110px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.2) 0 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 68%);mask:radial-gradient(circle,#000 15%,transparent 68%);animation:rot 14s linear infinite}
.sp{position:absolute;width:16px;height:16px;z-index:3;animation:tw 2s infinite}.sp.a{top:18px;left:16px}.sp.b{top:62px;right:14px;width:11px;height:11px;animation-delay:1s}
.tile .em{top:26px;z-index:2}.em .ic{width:94px;height:94px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.fan{position:relative;width:96px;height:104px}.fan .card{position:absolute;width:56px;height:80px;top:10px;padding:5px}
.fan .card:nth-child(1){left:0;transform:rotate(-14deg)}.fan .card:nth-child(2){right:0;transform:rotate(12deg)}.fan .card b{font-size:17px}.fan .card .s1{width:11px;height:11px}
.go{background:linear-gradient(#d9ff40,#a5d800);box-shadow:0 5px 0 #6b8a00,0 10px 20px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #6b8a00}
.go.alt{background:linear-gradient(#ff7a90,#e0204a);box-shadow:0 5px 0 #8a0f2d,0 10px 20px rgba(0,0,0,.35);text-shadow:none}
.nav button svg{display:block}.nav .lg{flex-direction:column;line-height:1.1;font-size:12px}
.ban div{position:relative;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.ban .ic{position:absolute;right:6px;bottom:4px;width:58px;height:58px;transform:rotate(14deg)}
.wheel{position:relative;width:150px;height:150px;margin:0 auto 12px;border-radius:50%;border:8px solid #f5c542;box-shadow:0 0 0 3px #7a4500,0 8px 24px rgba(0,0,0,.5);background:conic-gradient(#e63946 0 45deg,#ffd60a 0 90deg,#2a9d8f 0 135deg,#7b2ff7 0 180deg,#e63946 0 225deg,#ffd60a 0 270deg,#2a9d8f 0 315deg,#7b2ff7 0);animation:rot 14s linear infinite}
.wheel::after{content:"";position:absolute;inset:36%;border-radius:50%;background:radial-gradient(#fff3a0,#c98a00);box-shadow:0 0 0 3px #7a4500}
.wheel.mini{position:absolute;right:-20px;bottom:-24px;width:84px;height:84px;margin:0;border-width:5px}
.reels{position:relative;padding:20px 14px 14px;border-radius:24px;background:linear-gradient(#ffe27a,#c78a00 50%,#7a4b00);box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.6)}
.reels::before{content:"";position:absolute;left:14px;right:14px;top:6px;height:8px;background:radial-gradient(circle,#fff 35%,#ffb300 45%,transparent 50%) 0 0/16px 8px repeat-x;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.35}}
.reels::after{content:"";position:absolute;left:8px;right:8px;top:55%;height:2px;background:rgba(255,50,50,.75);pointer-events:none;z-index:2}
.reel{position:relative;background:linear-gradient(#0b0b12,#2b2b40 50%,#0b0b12);box-shadow:inset 0 0 18px #000;border-color:#5a3a00}
.reel::after{content:"";position:absolute;inset:0;border-radius:12px;background:linear-gradient(rgba(255,255,255,.2),transparent 40%)}
.reel .ic{width:78%;height:78%;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}.reel.sp .ic{filter:blur(2px)}
.w .reel{animation:pp .5s}@keyframes pp{50%{transform:scale(1.07)}}
.pay{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;align-items:center}.pay .ic{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:2px}
.sky{background:radial-gradient(circle at 20% 30%,#fff 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 1px,transparent 2px),radial-gradient(circle at 50% 60%,#fff 1px,transparent 2px),radial-gradient(circle at 85% 70%,#fff 1px,transparent 2px),linear-gradient(#050a2a,#1b2a6b 70%,#3a1c71)}
.sky .ic{width:86px;height:86px}.sky span{padding-bottom:6px}
.card{display:block;position:relative;background:linear-gradient(135deg,#fff,#e7eaf3);color:#111}
.card.r{color:#d62839}.card b{display:block;font-size:22px;line-height:1}.card .s1{width:14px;height:14px;margin-top:2px}.card .s2{position:absolute;right:6px;bottom:6px;width:54%;height:44%}
.card.big b{font-size:34px}.card.big .s1{width:22px;height:22px}.card.h{border:3px solid #fff}
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;border-radius:20px;background:linear-gradient(160deg,#7a3bd6,#c64fd9 55%,#ff8ac2);box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.55)}
.cell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center}.cell .ic{width:92%;height:92%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.cell.fall .ic{animation:fl .5s cubic-bezier(.3,1.3,.5,1) both}@keyframes fl{from{transform:translateY(-280%)}}
.cell.hit .ic{animation:ht .65s forwards}@keyframes ht{40%{transform:scale(1.25)}to{transform:scale(0);opacity:0}}
.cell em{position:absolute;left:50%;top:50%;transform:translate(-50%,-25%);font-style:normal;font-weight:900;font-size:13px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.rw{width:240px;margin:4px auto}
.rg{display:grid;grid-template-columns:30px repeat(12,1fr);grid-template-rows:repeat(3,38px);gap:3px;margin-top:8px}
.rb{position:relative;border:0;border-radius:6px;color:#fff;font-weight:800;font-size:12px;padding:0;background:#15151c;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.rb[data-k="n0"]{grid-row:1/4;background:#0a8a3a}
.rb i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ac);color:#111;font-size:10px;font-style:normal;line-height:20px;text-align:center;z-index:2;box-shadow:0 2px 4px rgba(0,0,0,.5)}.rb i:empty{display:none}
.ro{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px}.ro.t{grid-template-columns:repeat(3,1fr)}.ro .rb{height:36px;background:#1d2a3a}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.mt{aspect-ratio:1;border:0;border-radius:14px;background:linear-gradient(#6b7fa8,#2d3b5a);box-shadow:0 4px 0 #1a2338;padding:8%}
.mt.o{background:linear-gradient(#1b2b4a,#0f1a30);box-shadow:inset 0 0 12px #000;animation:pp .3s}.mt.d{opacity:.55}.mt .ic{width:100%;height:100%}
.mi{text-align:center;color:#fff;font-weight:800;margin:4px 0}
/* ===== GLASS REDESIGN ===== */
:root{--ac:#e9c46a;--ax:#2a1c05;--tx:#f6f1e7;--mu:rgba(246,241,231,.62);--gf:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06));--gbd:rgba(255,255,255,.22);--gs:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 30px rgba(0,0,0,.35)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--tx:#1b1a17;--mu:rgba(27,26,23,.6);--gf:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.45));--gbd:rgba(255,255,255,.9);--gs:inset 0 1px 0 #fff,0 10px 30px rgba(60,50,30,.18)}}
:root[data-theme="light"]{--tx:#1b1a17;--mu:rgba(27,26,23,.6);--gf:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.45));--gbd:rgba(255,255,255,.9);--gs:inset 0 1px 0 #fff,0 10px 30px rgba(60,50,30,.18)}
html,body{font-family:-apple-system,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:transparent}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;background:radial-gradient(40% 32% at 20% 14%,rgba(16,112,84,.6),transparent 70%),radial-gradient(34% 30% at 86% 26%,rgba(140,28,54,.55),transparent 70%),radial-gradient(46% 38% at 58% 88%,rgba(196,146,54,.3),transparent 70%),radial-gradient(30% 26% at 6% 70%,rgba(30,50,120,.4),transparent 70%);animation:amb 24s ease-in-out infinite alternate}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body::before{opacity:.55}}
@keyframes amb{to{transform:translate(5%,4%) rotate(7deg) scale(1.12)}}
.bal,.box,.tabs,.ban div,.bets button,.gh button,.pr input,.hist em{background:var(--gf);border:1px solid var(--gbd);box-shadow:var(--gs);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.box{border-radius:26px}.tabs{border-radius:20px;padding:5px}.bal{border-radius:20px}
.tabs button{transition:all .35s cubic-bezier(.3,1.4,.5,1);border-radius:15px}
.tabs button.on,.bets button.on{background:linear-gradient(180deg,#fbeab4,#d9b259 55%,#b98a2f);color:var(--ax);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 12px rgba(0,0,0,.3)}
h2{font-size:23px;letter-spacing:-.02em;font-weight:700}.logo{background:linear-gradient(180deg,#fff3c4,#d9b259 60%,#a67c2e);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:.04em}
#app>*{animation:up .7s cubic-bezier(.2,.9,.3,1) both}@keyframes up{from{opacity:0;transform:translateY(22px) scale(.98)}}
.bal.up{animation:gu 1s}.bal.dn{animation:gd .8s}
@keyframes gu{30%{box-shadow:0 0 0 4px rgba(90,230,150,.45),0 0 30px rgba(90,230,150,.5),var(--gs);transform:scale(1.07)}}
@keyframes gd{30%{box-shadow:0 0 0 3px rgba(230,90,100,.35),var(--gs);transform:scale(.96)}}
.tile{border:1px solid rgba(255,255,255,.3);border-radius:24px;filter:saturate(.82) contrast(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 16px 30px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.tile:active{transform:scale(.95)}
.tile::before{content:"";position:absolute;top:-50%;left:-90%;width:45%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(20deg);z-index:3;animation:shn 6s ease-in-out infinite;pointer-events:none}
.tile:nth-child(2)::before{animation-delay:1s}.tile:nth-child(3)::before{animation-delay:2s}.tile:nth-child(4)::before{animation-delay:3s}.tile:nth-child(5)::before{animation-delay:4s}
@keyframes shn{0%,55%{left:-90%}100%{left:150%}}
.tile b{font-family:Georgia,"Times New Roman",serif;font-weight:800;letter-spacing:.03em;font-size:17px}
.tile i{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:3px 8px}
.sp{opacity:.7}.glow{opacity:.55}
.ban div:nth-child(1){background:linear-gradient(135deg,rgba(178,40,64,.72),rgba(72,12,32,.78))!important}

.ban div{border-radius:22px;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}.ban div:active{transform:scale(.96)}
.nav{left:50%;right:auto;width:min(92vw,400px);transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:38px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(32px) saturate(200%);backdrop-filter:blur(32px) saturate(200%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -10px 18px rgba(255,255,255,.04),0 20px 44px rgba(0,0,0,.5);animation:nin .9s cubic-bezier(.2,1.2,.3,1) both}

.go:active{transform:scale(.96);box-shadow:inset 0 2px 6px rgba(120,80,10,.5),0 3px 8px rgba(0,0,0,.4)}

.btn{background:linear-gradient(180deg,#fbeab4,#d9b259 55%,#b98a2f);color:var(--ax);box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}

/* ===== ЗВУК И МУЗЫКА (Web Audio, без файлов) ===== */
const AU={on:true,c:null,m:null,nb:null},MU={on:true,run:false,i:0,o:null,t:null};
let MODE=2;try{const v=localStorage.getItem("nv_mode");if(v!==null)MODE=+v}catch(e){}

function ac(){if(!AU.c){try{const c=AU.c=new(window.AudioContext||window.webkitAudioContext)(),m=AU.m=c.createGain(),k=c.createDynamicsCompressor();m.gain.value=.9;k.threshold.value=-18;k.ratio.value=4;m.connect(k);k.connect(c.destination)}catch(e){return null}}if(AU.c.state=="suspended")AU.c.resume();return AU.c}
function tone(f,d,t="sine",v=.1,s=0,f2,out){const c=ac();if(!c||(!AU.on&&!out))return;const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+s;o.type=t;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(out||AU.m);o.start(t0);o.stop(t0+d+.03)}
function bell(f,d=1,v=.08,s=0,out){[[1,1],[2.76,.4],[5.4,.18],[8.9,.07]].forEach(([r,a],i)=>tone(f*r,d*(1-i*.18),"sine",v*a,s,0,out))}
function nz(d,v=.1,f1=800,f2=0,s=0){const c=ac();if(!c||!AU.on)return;if(!AU.nb){const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;AU.nb=b}const o=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t0=c.currentTime+s;o.buffer=AU.nb;f.type="bandpass";f.Q.value=.8;f.frequency.setValueAtTime(f1,t0);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+d*.2);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(f);f.connect(g);g.connect(AU.m);o.start(t0,Math.random());o.stop(t0+d+.02)}
function thud(f,v,d){tone(f,d,"sine",v,0,f*.45);nz(d*.5,v*.35,200,80)}

const CH=[[220,261.63,329.63,392,493.88],[174.61,220,261.63,329.63,392],[196,261.63,329.63,392,493.88],[196,246.94,293.66,329.63,440]],BS=[110,87.31,65.41,98],PN=[440,523.25,587.33,659.25,784,880,1046.5];
